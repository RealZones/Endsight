name: Release

# One push to the default branch = one GitHub release and ONE Discord post: an embed
# carrying the commit message and the release link, with the jar attached to it.
# Nothing for other branches, and no separate commit / jar / release messages.
# A push that only touches the README, the screenshots under docs, the licence or
# this workflow is not a release either: nobody needs a jar for a paragraph.

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/**'

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 25 because build.gradle pins it: options.release = 25 and
      # source/targetCompatibility = VERSION_25. Anything lower fails to compile.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version and commit
        id: info
        shell: bash
        run: |
          VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
          [[ -z "$VERSION" ]] && { echo "::error::mod_version not found in gradle.properties"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/commit/$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "msg<<EOF"
            git log -1 --pretty=%B
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The repo was created on Windows, where the executable bit is not always
      # recorded. Without this the runner fails with "Permission denied".
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.version }}-${{ steps.info.outputs.short }}
          name: Endsight ${{ steps.info.outputs.version }}
          body: ${{ steps.info.outputs.msg }}
          files: |
            build/libs/*.jar

      - name: Post to Discord
        if: contains(github.event.head_commit.message, '[discord]')
        # The release above is the changelog now; this is best-effort since the Discord
        # account went (2026-09-20), and a dead webhook must not fail the release.
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ steps.info.outputs.version }}
          SHORT: ${{ steps.info.outputs.short }}
          COMMIT_URL: ${{ steps.info.outputs.url }}
          COMMIT_MSG: ${{ steps.info.outputs.msg }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          # withSourcesJar() is on in build.gradle, so build/libs always holds a
          # -sources jar next to the real one. Excluded here.
          MAIN_JAR="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          [[ -z "$MAIN_JAR" ]] && { echo "::error::no jar in build/libs"; exit 1; }

          # Discord caps an embed description at 4096; the message is the description.
          PAYLOAD="$(jq -cn \
            --arg title "Endsight $VERSION" \
            --arg msg "${COMMIT_MSG:0:3900}" \
            --arg release "$RELEASE_URL" \
            --arg commit "$COMMIT_URL" \
            --arg short "$SHORT" \
            --arg time "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{
              username: "Endsight",
              embeds: [{
                title: $title,
                description: $msg,
                color: 8339378,
                timestamp: $time,
                fields: [
                  {name: "Release", value: ("[" + $short + "](" + $release + ")"), inline: true},
                  {name: "Commit", value: ("[view](" + $commit + ")"), inline: true}
                ]
              }]
            }'
          )"

          # From a file, not inline: curl reads ';' and ',' in a -F value as option
          # separators, so a commit message with a semicolon in it truncated the
          # JSON at that point and Discord refused the post. A file has no such rule.
          printf '%s' "$PAYLOAD" > payload.json
          curl -sS --fail-with-body \
            -F "payload_json=<payload.json;type=application/json" \
            -F "file1=@${MAIN_JAR}" \
            "$WEBHOOK"
